<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Task Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .dashboard-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #007bff;
            color: white;
        }

        .dashboard-content {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }

        .btn {
            width: 250px;
            font-size: 16px;
            padding: 15px;
            margin: 15px;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .btn-assign {
            background-color: #28a745;
            color: white;
        }

        .btn-assign:hover {
            background-color: #218838;
            border: solid 1px #28a745;
        }

        .btn-status {
            background-color: #ffc107;
            color: white;
        }

        .btn-status:hover {
            background-color: #d39e00;
            border: solid 1px #ffc107;
        }

        .btn:hover {
            opacity: 0.8;
        }

        footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-content">
            <h1>Admin Dashboard</h1>
            <p>Welcome, Admin! What would you like to do?</p>
            <div class="buttons">
                <a href="assign_task.html" class="btn btn-assign">Assign Task</a>
                <a href="view_task_status.html" class="btn btn-status">View Task Status</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Task Management System. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
