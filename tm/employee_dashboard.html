<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - Update Tasks</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.5rem;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .table th, .table td {
            vertical-align: middle;
            color: #111;
        }

        .status-input {
            width: 120px;
        }

        .update-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .update-btn:hover {
            background-color: #0056b3;
        }

        .attachments-input {
            width: 150px;
        }

        .loading-icon {
            display: none;
            font-size: 2rem;
            text-align: center;
            margin-top: 20px;
        }

        .row-in-progress {
            background-color: #f5da83 !important; /* Yellow */
        }

        .row-pending {
            background-color: #f88790 !important; /* Red */
        }

        .row-completed {
            background-color: #82f39d !important; /* Green */
        }

        .row-in-progress td,
        .row-pending td,
        .row-completed td {
            color: #111;
        }

        .table tbody tr:hover {
            background-color: #e9ecef;
        }

        @media (max-width: 768px) {
            .table th, .table td {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Employee Task Dashboard</h2>

        <!-- Tabs for Daily and Weekly Views -->
        <div class="mb-3">
            <ul class="nav nav-tabs" id="taskTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link active" id="dailyTab" data-bs-toggle="tab" href="#daily" role="tab">Daily</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="weeklyTab" data-bs-toggle="tab" href="#weekly" role="tab">Weekly</a>
                </li>
            </ul>
        </div>

        <div class="tab-content">
            <!-- Daily View -->
            <div class="tab-pane fade show active" id="daily" role="tabpanel">
                <!-- Filter Section -->
                <div class="row mb-3">
                    <div class="col-12 col-md-6 col-lg-4">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by Task Name or ID">
                    </div>
                    <div class="col-6 col-md-3 col-lg-2">
                        <select class="form-control" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3 col-lg-2">
                        <button class="btn btn-primary w-100" id="applyFilters">Apply Filters</button>
                    </div>
                </div>

                <!-- Task List Table for Daily View -->
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Task ID</th>
                                <th>Task Name</th>
                                <th>Task Description</th>
                                <th>Priority</th>
                                <th>Assigned Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Reason</th>
                                <th>Attachments</th>
                                <th>Update</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody">
                            <!-- Task rows will be dynamically populated -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination for Daily View -->
                <nav>
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- Pagination buttons will be dynamically added here -->
                    </ul>
                </nav>

                <!-- Loading Icon -->
                <div class="loading-icon" id="loadingIcon">
                    <i class="fas fa-spinner fa-spin"></i> Loading tasks...
                </div>
            </div>

            <!-- Weekly View -->
            <div class="tab-pane fade" id="weekly" role="tabpanel">
                <!-- Filter Section for Weekly View -->
                <div class="row mb-3">
                    <div class="col-12 col-md-6 col-lg-4">
                        <input type="text" class="form-control" id="searchInputWeekly" placeholder="Search by Task Name or ID">
                    </div>
                    <div class="col-6 col-md-3 col-lg-2">
                        <select class="form-control" id="statusFilterWeekly">
                            <option value="">All Status</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3 col-lg-2">
                        <button class="btn btn-primary w-100" id="applyFiltersWeekly">Apply Filters</button>
                    </div>
                </div>

                <!-- Task List Table for Weekly View -->
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Task ID</th>
                                <th>Task Name</th>
                                <th>Task Description</th>
                                <th>Priority</th>
                                <th>Assigned Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Reason</th>
                                <th>Attachments</th>
                                <th>Update</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBodyWeekly">
                            <!-- Task rows will be dynamically populated -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination for Weekly View -->
                <nav>
                    <ul class="pagination justify-content-center" id="paginationWeekly">
                        <!-- Pagination buttons will be dynamically added here -->
                    </ul>
                </nav>

                <!-- Loading Icon -->
                <div class="loading-icon" id="loadingIconWeekly">
                    <i class="fas fa-spinner fa-spin"></i> Loading tasks...
                </div>
            </div>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {
    const tasksPerPage = 5;
    let currentPage = 1;
    let allTasks = [];

    // Load tasks on page load
    loadTasks();

    // Apply Filters and Render Tasks
    $('#applyFilters').click(function () {
        applyFiltersAndRender('daily');
    });

    $('#applyFiltersWeekly').click(function () {
        applyFiltersAndRender('weekly');
    });

    // Debounce search input to limit AJAX calls
    let searchTimeout;
    $('#searchInput, #searchInputWeekly').on('input', function () {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            applyFiltersAndRender('daily');
            applyFiltersAndRender('weekly');
        }, 500); // 500ms debounce
    });

    $('#statusFilter').change(function () {
        applyFiltersAndRender('daily');
    });

    $('#statusFilterWeekly').change(function () {
        applyFiltersAndRender('weekly');
    });

    // Fetch tasks from Google Apps Script API
    function loadTasks(view = 'daily') {
        $('#loadingIcon').show();
        $('#loadingIconWeekly').show();

        $.ajax({
            url: 'https://script.google.com/macros/s/AKfycbwnME12S5bdXYvIOe6o9kyjB3VPiarfQtH6MkBEe95rzonos9bLsbQuS_j3AIiYmsvu/exec',
            method: 'GET',
            success: function (response) {
                try {
                    allTasks = typeof response === 'string' ? JSON.parse(response) : response;
                    allTasks.sort((a, b) => new Date(b.assignedDate) - new Date(a.assignedDate));
                    if (view === 'daily') {
                        renderTasks('daily');
                    } else {
                        renderTasks('weekly');
                    }
                } catch (error) {
                    console.error("Error parsing response:", error.message);
                    alert("Invalid server response.");
                }
            },
            error: function (xhr, status, error) {
                console.error("Error fetching data:", error);
                alert("Failed to fetch tasks.");
            },
            complete: function () {
                $('#loadingIcon').hide();
                $('#loadingIconWeekly').hide();
            }
        });
    }

    // Render filtered tasks based on view (daily or weekly)
    function renderTasks(view) {
        const tableBody = (view === 'daily') ? $('#taskTableBody') : $('#taskTableBodyWeekly');
        const filteredTasks = filterTasks(view);

        tableBody.empty();

        const startIndex = (currentPage - 1) * tasksPerPage;
        const paginatedTasks = filteredTasks.slice(startIndex, startIndex + tasksPerPage);

        if (paginatedTasks.length > 0) {
            paginatedTasks.forEach(task => {
                const rowClass = getRowClass(task.status);
                const statusIcon = getStatusIcon(task.status);
                const row = ` 
                    <tr class="${rowClass}">
                        <td>${task.taskId || 'N/A'}</td>
                      <td>
                            <input type="text" class="form-control task-name-input   attachments-input" data-task-id="${task.taskId}" value="${task.taskName || ''}" readonly="readonly" />
                        </td>
                        <td>${task.taskDescription || 'N/A'}</td>
                        <td>${task.priority || 'N/A'}</td>
                        <td>${task.assignedDate || 'N/A'}</td>
                        <td>${task.dueDate || 'N/A'}</td>
                        <td>
                            <i class="fas ${statusIcon}"></i> ${task.status || 'N/A'}
                            <select class="form-control status-input" data-task-id="${task.taskId}">
                                <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </td>
                        <td>
                            <textarea class="form-control reason-input" data-task-id="${task.taskId}">${task.reason || ''}</textarea>
                        </td>
                        <td>
                            <input type="text" class="form-control attachments-input" data-task-id="${task.taskId}" value="${task.attachment || ''}" placeholder="Link to attachment" />
                        </td>
                        <td>
                            <button class="btn update-btn update-task-btn" data-task-id="${task.taskId}">
                                <i class="fas fa-save"></i> Update
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.append(row);
            });
        } else {
            tableBody.append('<tr><td colspan="10" class="text-center">No tasks found.</td></tr>');
        }

        renderPagination(filteredTasks.length, view);
    }

    // Apply filters and render tasks
    function applyFiltersAndRender(view) {
        currentPage = 1; // Reset to first page after filtering
        renderTasks(view);
    }

    // Filter tasks based on search input and status filter
    function filterTasks(view) {
        const searchQuery = (view === 'daily') ? $('#searchInput').val().toLowerCase() : $('#searchInputWeekly').val().toLowerCase();
        const statusFilter = (view === 'daily') ? $('#statusFilter').val() : $('#statusFilterWeekly').val();
        const today = new Date();
        const startOfWeek = new Date(today.setDate(today.getDate() - today.getDay())); // Get the start of the week

        return allTasks.filter(task => {
            const taskDate = new Date(task.assignedDate);
            const isMatchingSearch = task.taskName.toLowerCase().includes(searchQuery) || task.taskId.toLowerCase().includes(searchQuery);
            const isMatchingStatus = statusFilter ? task.status === statusFilter : true;
            const isWithinDateRange = view === 'daily' ? taskDate.toDateString() === new Date().toDateString() : taskDate >= startOfWeek;

            return isMatchingSearch && isMatchingStatus && isWithinDateRange;
        });
    }

    // Get row class based on status
    function getRowClass(status) {
        switch (status) {
            case 'In Progress': return 'row-in-progress';
            case 'Pending': return 'row-pending';
            case 'Completed': return 'row-completed';
            default: return '';
        }
    }

    // Get icon based on status
    function getStatusIcon(status) {
        switch (status) {
            case 'In Progress': return 'fa-spinner fa-spin';
            case 'Pending': return 'fa-clock';
            case 'Completed': return 'fa-check';
            default: return 'fa-question-circle';
        }
    }

    // Render pagination
    function renderPagination(totalTasks, view) {
        const pagination = (view === 'daily') ? $('#pagination') : $('#paginationWeekly');
        pagination.empty();

        const totalPages = Math.ceil(totalTasks / tasksPerPage);
        for (let i = 1; i <= totalPages; i++) {
            const activeClass = (i === currentPage) ? 'active' : '';
            pagination.append(`
                <li class="page-item ${activeClass}">
                    <a class="page-link" href="#" data-page="${i}">${i}</a>
                </li>
            `);
        }

        $('.page-link').click(function (e) {
            e.preventDefault();
            currentPage = $(this).data('page');
            renderTasks(view);
        });
    }

    // Update task when update button is clicked
    $(document).on('click', '.update-task-btn', function () {
        const taskId = $(this).data('task-id');
        const taskName = $(this).closest('tr').find('.task-name-input').val();
        const status = $(this).closest('tr').find('.status-input').val();
        const reason = $(this).closest('tr').find('.reason-input').val();
        const attachment = $(this).closest('tr').find('.attachments-input').val();
      

        updateTask(taskId,taskName, status, reason, attachment);
    });

    // Function to update task details and send email
    function updateTask(taskId,taskName, status, reason, attachment) {
        $.ajax({
            url: 'https://script.google.com/macros/s/AKfycbwnME12S5bdXYvIOe6o9kyjB3VPiarfQtH6MkBEe95rzonos9bLsbQuS_j3AIiYmsvu/exec',
            method: 'POST',
            data: {
                taskId: taskId,
              taskName: taskName,
                status: status,
                reason: reason,
                attachment: attachment,
                action: 'update'
            },
            success: function (response) {
                // Send email notification after task update
                sendEmailNotification(taskId,taskName, status, reason, attachment);
                alert('Task updated successfully!');
                loadTasks();
            },
            error: function (xhr, status, error) {
                console.error("Error updating task:", error);
                alert("Failed to update task.");
            }
        });
    }

    // Send email notification after task update
    function sendEmailNotification(taskId, taskName, status, reason, attachment) {
        $.ajax({
            url: 'send_update_email.php', // PHP script that sends the email
            method: 'POST',
            data: {
                taskId: taskId,
                taskName: taskName,
                status: status,
                reason: reason,
                attachment: attachment
            },
            success: function (response) {
                console.log('Email sent successfully.');
            },
            error: function (xhr, status, error) {
                console.error("Error sending email:", error);
            }
        });
    }
});
</script>
</body>
</html>
