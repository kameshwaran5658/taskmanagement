<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Tasks</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.5rem;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-tabs .nav-link.active {
            font-weight: bold;
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .row-in-progress {
            background-color: #fff3cd !important; /* Yellow */
        }

        .row-pending {
            background-color: #f8d7da !important; /* Red */
        }

        .row-completed {
            background-color: #d4edda !important; /* Green */
        }

        .loading-icon {
            display: none;
            font-size: 2rem;
            text-align: center;
            margin-top: 20px;
        }

        .filter-input {
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .table th, .table td {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Assigned Tasks</h2>

        <!-- Tab Navigation -->
        <ul class="nav nav-tabs" id="taskTabs">
            <li class="nav-item">
                <a class="nav-link active" href="#" id="viewAll">All Tasks</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="viewDaily">Daily View</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="viewWeekly">Weekly View</a>
            </li>
        </ul>

        <!-- Search and Filter Section -->
        <div class="row mt-3">
            <div class="col-12 col-md-4 filter-input">
                <input type="text" class="form-control" id="searchInput" placeholder="Search by Task Name or ID">
            </div>
            <div class="col-12 col-md-4 filter-input">
                <select class="form-control" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="col-12 col-md-4">
                <button class="btn btn-primary w-100" id="applyFilters">Apply Filters</button>
            </div>
        </div>

        <!-- Loading Icon -->
        <div class="loading-icon" id="loadingIcon">
            <i class="fas fa-spinner fa-spin"></i> Loading tasks...
        </div>

        <!-- Tasks Table -->
        <div class="table-responsive">
            <table class="table table-bordered mt-3">
                <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Task Name</th>
                        <th>Task Description</th>
                        <th>Priority</th>
                        <th>Assigned Date</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Reason</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <!-- Task rows will be dynamically populated -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <nav>
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination buttons will be dynamically added here -->
            </ul>
        </nav>
    </div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {
            const tasksPerPage = 5;
            let currentPage = 1;
            let allTasks = [];
            let filteredTasks = [];

            loadTasks();

            // Apply filters button click
            $('#applyFilters').click(function () {
                applyFilters();
            });

            // Search input handler
            $('#searchInput').on('input', function () {
                applyFilters();
            });

            // Status filter handler
            $('#statusFilter').change(function () {
                applyFilters();
            });

            // Tab click handlers
            $('#viewAll').click(function (e) {
                e.preventDefault();
                currentPage = 1;
                renderTasks(allTasks);
                setActiveTab(this);
            });

            $('#viewDaily').click(function (e) {
                e.preventDefault();
                currentPage = 1;
                filteredTasks = getFilteredTasks('daily');
                renderTasks(filteredTasks);
                setActiveTab(this);
            });

            $('#viewWeekly').click(function (e) {
                e.preventDefault();
                currentPage = 1;
                filteredTasks = getFilteredTasks('weekly');
                renderTasks(filteredTasks);
                setActiveTab(this);
            });

            // Fetch tasks from Google Apps Script API
            function loadTasks() {
                $('#loadingIcon').show();
                $('.table-responsive').hide();

                $.ajax({
                    url: 'https://script.google.com/macros/s/AKfycbzK0-1pFeD5ChefCU3vThI4y2OPQ95DU3pbn6tAdbPTv6I8Qj-PVGohccvX1vwdAg/exec',
                    method: 'GET',
                    success: function (response) {
                        try {
                            allTasks = typeof response === 'string' ? JSON.parse(response) : response;
                            filteredTasks = allTasks;  // Initially all tasks
                            renderTasks(filteredTasks);
                        } catch (error) {
                            console.error("Error parsing response:", error.message);
                            alert("Invalid server response.");
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error("Error fetching data:", error);
                        alert("Failed to fetch tasks.");
                    },
                    complete: function () {
                        $('#loadingIcon').hide();
                        $('.table-responsive').show();
                    }
                });
            }

            // Render tasks on the page
            function renderTasks(tasks) {
                const tableBody = $('#taskTableBody');
                tableBody.empty();

                const startIndex = (currentPage - 1) * tasksPerPage;
                const paginatedTasks = tasks.slice(startIndex, startIndex + tasksPerPage);

                if (paginatedTasks.length > 0) {
                    paginatedTasks.forEach(task => {
                        const rowClass = getRowClass(task.status);
                        const row = `
                            <tr class="${rowClass}">
                                <td>${task.taskId || 'N/A'}</td>
                                <td>${task.taskName || 'N/A'}</td>
                                <td>${task.taskDescription || 'N/A'}</td>
                                <td>${task.priority || 'N/A'}</td>
                                <td>${task.assignedDate || 'N/A'}</td>
                                <td>${task.dueDate || 'N/A'}</td>
                                <td>${task.status || 'N/A'}</td>
                                <td>${task.reason || 'N/A'}</td>
                            </tr>
                        `;
                        tableBody.append(row);
                    });
                } else {
                    tableBody.append('<tr><td colspan="8" class="text-center">No tasks found.</td></tr>');
                }

                renderPagination(tasks.length);
            }

            // Filter tasks based on search input, status filter, and the current tab view
            function applyFilters() {
                const searchTerm = $('#searchInput').val().toLowerCase();
                const statusFilter = $('#statusFilter').val().toLowerCase();

                const filtered = allTasks.filter(task => {
                    const matchesSearch = task.taskName.toLowerCase().includes(searchTerm) || task.taskId.toLowerCase().includes(searchTerm);
                    const matchesStatus = !statusFilter || task.status.toLowerCase().includes(statusFilter);

                    return matchesSearch && matchesStatus;
                });

                filteredTasks = filtered;
                renderTasks(filteredTasks);
            }

            // Get filtered tasks based on daily or weekly view
            function getFilteredTasks(view) {
                const today = new Date();
                const startOfWeek = new Date(today.setDate(today.getDate() - today.getDay()));
                const endOfWeek = new Date(today.setDate(today.getDate() - today.getDay() + 6));

                if (view === 'daily') {
                    return allTasks.filter(task => {
                        const assignedDate = new Date(task.assignedDate);
                        return assignedDate.toDateString() === today.toDateString();
                    });
                } else if (view === 'weekly') {
                    return allTasks.filter(task => {
                        const assignedDate = new Date(task.assignedDate);
                        return assignedDate >= startOfWeek && assignedDate <= endOfWeek;
                    });
                }

                return allTasks;  // Default: all tasks
            }

            // Render pagination based on the filtered tasks
            function renderPagination(totalTasks) {
                const totalPages = Math.ceil(totalTasks / tasksPerPage);
                const pagination = $('#pagination');
                pagination.empty();

                for (let i = 1; i <= totalPages; i++) {
                    const pageItem = $('<li class="page-item"></li>')
                        .append(`<a class="page-link" href="#">${i}</a>`);

                    pageItem.click(function (e) {
                        e.preventDefault();
                        currentPage = i;
                        renderTasks(filteredTasks);
                    });

                    pagination.append(pageItem);
                }
            }

            // Set the active tab styling
            function setActiveTab(tabElement) {
                $('.nav-link').removeClass('active');
                $(tabElement).addClass('active');
            }

            // Get row class based on task status
            function getRowClass(status) {
                switch (status) {
                    case 'In Progress': return 'row-in-progress';
                    case 'Pending': return 'row-pending';
                    case 'Completed': return 'row-completed';
                    default: return '';
                }
            }
        });
    </script>
</body>
</html>
